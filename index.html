<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data:; media-src https: blob:; connect-src https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;">
<title>TorrFlix</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="splash"><div class="splash-mark"><span class="logo-badge xl"><span class="logo-tri"></span></span><div class="splash-word">TORR<span class="fx">FLIX</span></div></div><div class="splash-tag">MOVIES &nbsp;•&nbsp; TV &nbsp;•&nbsp; LIVE</div></div>

<div id="lock-screen">
  <div class="lock-box">
    <div class="logo big"><span class="logo-badge"><span class="logo-tri"></span></span>TORR<span class="fx">FLIX</span></div>
    <div id="lock-content"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="logo"><span class="logo-badge"><span class="logo-tri"></span></span>TORR<span class="fx">FLIX</span></div>
    <nav>
      <button class="nav-btn active" data-nav="home">Home</button>
      <button class="nav-btn" data-nav="movies">Movies</button>
      <button class="nav-btn" data-nav="series">TV Shows</button>
      <button class="nav-btn" data-nav="upcoming">Coming Soon</button>
      <button class="nav-btn" data-nav="livetv">Live TV</button>
      <button class="nav-btn" data-nav="library">My Library</button>
      <button class="nav-btn" data-nav="debrid">AllDebrid</button>
      <button class="nav-btn" data-nav="settings">Settings</button>
    </nav>
    <div class="side-foot" id="ad-status">AllDebrid: not set up</div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="back-btn" class="ghost-btn hidden">← Back</button>
      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="Search movies &amp; TV shows..." autocomplete="off">
        <button id="search-btn">Search</button>
      </div>
      <div id="user-chip"></div>
      <button id="lock-btn" class="ghost-btn">Lock</button>
    </header>

    <section id="view-home" class="view"></section>
    <section id="view-browse" class="view hidden"></section>
    <section id="view-detail" class="view hidden"></section>
    <section id="view-library" class="view hidden"></section>
    <section id="view-debrid" class="view hidden"></section>
    <section id="view-settings" class="view hidden"></section>
    <section id="view-upcoming" class="view hidden"></section>
    <section id="view-livetv" class="view hidden"></section>

    <section id="view-player" class="view hidden">
      <div class="player-head">
        <button id="player-back" class="ghost-btn">← Back</button>
        <div id="player-title" class="player-title"></div>
      </div>
      <video id="player" controls autoplay></video>
      <div id="player-msg" class="player-msg hidden"></div>
      <div class="player-actions">
        <button id="player-copy" class="red-btn">Copy stream link</button>
        <select id="boost-sel" class="boost-sel">
          <option value="1">Volume boost: Off</option>
          <option value="1.5">Volume boost: 1.5x</option>
          <option value="2">Volume boost: 2x</option>
          <option value="3">Volume boost: 3x</option>
          <option value="4">Volume boost: 4x</option>
        </select>
      </div>
      <p class="hint">Everything plays in the built-in TorrFlix player - 4K, MKV, HEVC and every sound format included. Subtitles: if English subtitles were found, they are already loaded in the player.</p>
    </section>
  </main>
</div>
<div id="toast" class="hidden"></div>
<script>
window.crimson = {
  openExternal: function (u) { window.open(u, '_blank'); },
  copyText: function (t) { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(function () {}); },
  playPlayer: null,
  ensurePlayer: async function () { return { ok: false }; },
  onPlayerProgress: function () { return function () {}; },
  fetchJson: null
};
</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
